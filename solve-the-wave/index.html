<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0512">
  <meta name="description" content="You Do Not Need To Solve The Wave, a Cosmic Acid print from the Acid Goblin series.">
  <title>You Do Not Need To Solve The Wave</title>
  <style>
    :root {
      --ink: #f4ead4;
      --violet: #b98ef0;
      --pink: #f4479a;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; color-scheme: dark; background: #0b0512; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 8%, rgb(244 71 154 / 14%), transparent 45%),
        radial-gradient(circle at 85% 90%, rgb(185 142 240 / 16%), transparent 45%),
        #0b0512;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 3rem;
    }
    header {
      width: 100%;
      max-width: 46rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1.25rem;
    }
    a.shelf-back {
      text-decoration: none;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    a.shelf-back:hover { border-color: var(--pink); color: var(--pink); }
    .kicker {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--violet);
      text-align: right;
    }
    figure {
      margin: 0;
      width: 100%;
      max-width: 40rem;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 24px 70px rgb(0 0 0 / 55%);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.7;
      max-width: 32rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="shelf-back" href="../index.html">&larr; shelf</a>
    <span class="kicker">Cosmic Acid &middot; Print</span>
  </header>

  <figure>
    <img src="./assets/solve-the-wave-v1.png" alt="A cosmic acid-color illustration of a green goblin holding a heart-shaped teacup that overflows into ocean waves, framed by a smiling sun, a crescent moon, stars, and a UFO. Arched lettering reads: You do not need to solve the wave.">
    <figcaption>Cosmic Acid, from the Acid Goblin series.</figcaption>
  </figure>
</body>
</html>
